name: Build DeltaForce Assistant APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.configureondemand=true -Dkotlin.compiler.execution.strategy=in-process"
      JAVA_TOOL_OPTIONS: "-Xmx3g"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (manual with retry)
        run: |
          set -euo pipefail
          
          echo "=== Installing dependencies ==="
          sudo apt-get update -qq
          sudo apt-get install -qq -y wget unzip
          
          echo "=== Downloading cmdline-tools (with retry) ==="
          mkdir -p android-sdk
          cd android-sdk
          
          for url in \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            "https://mirrors.cloud.tencent.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            "https://mirrors.tuna.tsinghua.edu.cn/android/repository/commandlinetools-linux-11076708_latest.zip"; do
            echo "Trying: $url"
            if wget -q --timeout=60 --tries=3 "$url" -O cmdline-tools.zip; then
              echo "Downloaded successfully"
              break
            else
              echo "Failed, trying next mirror..."
            fi
          done
          
          if [ ! -f cmdline-tools.zip ]; then
            echo "ERROR: All mirrors failed"
            exit 1
          fi
          
          unzip -q cmdline-tools.zip
          mv cmdline-tools cmdline-tools.latest
          mkdir -p cmdline-tools
          mv cmdline-tools.latest cmdline-tools/latest
          rm cmdline-tools.zip
          cd ..
          
          export ANDROID_SDK_ROOT=$PWD/android-sdk
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          echo "=== Accepting licenses ==="
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          echo "=== Installing packages ==="
          for pkg in \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"; do
            echo "Installing: $pkg"
            for i in 1 2 3; do
              if $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "$pkg"; then
                echo "  ✓ $pkg"
                break
              else
                echo "  Retry $i/3 for $pkg..."
                sleep 5
              fi
            done
          done
          
          echo "=== Verifying installation ==="
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed | grep -E "platforms|build-tools|ndk|cmake"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== BUILD EXIT CODE: $EXIT_CODE ==="
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== LAST 300 LINES OF BUILD LOG ==="
            tail -300 build.log
          fi
          exit $EXIT_CODE

      - name: Find APK
        if: always()
        run: |
          echo "=== Finding APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo "=== Listing app/build/outputs ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug dir"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceAssistant-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*/debug/*.apk
          retention-days: 30

      - name: Build Release APK (if signing configured)
        if: env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != ''
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceAssistant-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/release/*.apk
          retention-days: 30