name: Build DeltaForce Assistant APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK (manual with retry)
        run: |
          set -euo pipefail
          
          echo "=== Installing dependencies ==="
          sudo apt-get update -qq
          sudo apt-get install -qq -y wget unzip
          
          echo "=== Downloading cmdline-tools (with retry) ==="
          mkdir -p android-sdk/cmdline-tools
          cd android-sdk/cmdline-tools
          
          # Try multiple mirrors
          for url in \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            "https://mirrors.cloud.tencent.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            "https://mirrors.tuna.tsinghua.edu.cn/android/repository/commandlinetools-linux-11076708_latest.zip"; do
            echo "Trying: $url"
            if wget -q --timeout=60 --tries=3 "$url" -O cmdline-tools.zip; then
              echo "Downloaded successfully"
              break
            else
              echo "Failed, trying next mirror..."
            fi
          done
          
          if [ ! -f cmdline-tools.zip ]; then
            echo "ERROR: All mirrors failed"
            exit 1
          fi
          
          # Unzip - the zip contains a 'cmdline-tools' directory inside
          unzip -q cmdline-tools.zip
          # Move contents up one level (zip extracts to cmdline-tools/)
          mv cmdline-tools/* .
          rmdir cmdline-tools
          rm cmdline-tools.zip
          cd ../..
          
          export ANDROID_SDK_ROOT=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools
          
          echo "=== Accepting licenses ==="
          yes | $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          echo "=== Installing packages ==="
          # Install with retry
          for pkg in \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"; do
            echo "Installing: $pkg"
            for i in 1 2 3; do
              if $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager "$pkg"; then
                echo "  ✓ $pkg"
                break
              else
                echo "  Retry $i/3 for $pkg..."
                sleep 5
              fi
            done
          done
          
          echo "=== Verifying installation ==="
          $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager --list_installed | grep -E "platforms|build-tools|ndk|cmake"
          
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceAssistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (if signing configured)
        if: env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != ''
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceAssistant-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30