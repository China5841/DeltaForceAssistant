name: Build DeltaForce Assistant APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          build-tools-version: 34.0.0
          cmake-version: 3.22.1

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceAssistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (if signing configured)
        if: env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != ''
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceAssistant-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # 可选：构建 ARM64 版本（如果 NDK 支持）
  build-arm64:
    name: Build ARM64 APK (Experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: false  # 默认关闭，ARM64 构建工具链尚未完全成熟

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26d
          build-tools-version: 34.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ARM64 Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -Pandroid.experimental.build.aar.abi.arm64-v8a=true \
            --no-daemon --stacktrace

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaForceAssistant-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30